name: Deploy Flutter Web to Firebase

on:
  workflow_dispatch: # This adds the "Run workflow" button in GitHub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (required for some Flutter tools)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x' # Or your specific stable version
          channel: 'stable'

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Build Flutter Web
        run: |
          APP_VERSION=$(date +%s)
          flutter build web --release --pwa-strategy=none --dart-define=APP_VERSION="$APP_VERSION"

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: 'live'
        env:
          FIREBASE_CLI_PREVIEWS: hostingchannels