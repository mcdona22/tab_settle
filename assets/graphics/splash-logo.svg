<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Glowing background gradient circle -->
  <circle cx="256" cy="256" r="200" fill="url(#glow_grad)" opacity="0.15"/>
  
  <!-- Abstract Tab Settle Interlocking Cards / Splitting Icon -->
  <g transform="translate(106, 106)">
    <!-- Back Card / Deep Accent -->
    <rect x="50" y="30" width="180" height="240" rx="24" fill="#00120B" stroke="#FF8800" stroke-width="8" stroke-opacity="0.4" transform="rotate(-12 140 150)"/>
    
    <!-- Front Card / Glowing Orange Accent -->
    <rect x="80" y="40" width="180" height="240" rx="24" fill="url(#card_grad)" stroke="#FF8800" stroke-width="6"/>
    
    <!-- Abstract Division / Settlement Slits -->
    <path d="M 120 110 L 220 110" stroke="#00120B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 120 150 L 190 150" stroke="#00120B" stroke-width="12" stroke-linecap="round"/>
    <path d="M 120 190 L 160 190" stroke="#00120B" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Floating Checkmark / Settle Node -->
    <circle cx="210" cy="190" r="18" fill="#FF8800"/>
    <path d="M 202 190 L 208 196 L 218 184" stroke="#00120B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Definitions for Gradients -->
  <defs>
    <radialGradient id="glow_grad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
      <stop stop-color="#FF8800"/>
      <stop offset="1" stop-color="#00120B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card_grad" x1="80" y1="40" x2="260" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8800"/>
      <stop offset="1" stop-color="#E07000"/>
    </linearGradient>
  </defs>
</svg>
