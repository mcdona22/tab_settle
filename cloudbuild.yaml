steps:
  # Step 1: Build Docker image with Secret injection
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg GEMINI_API_KEY=$$GEMINI_KEY \
          -t europe-west2-docker.pkg.dev/$PROJECT_ID/tab-settle-repo/tab-settle-web:$BUILD_ID \
          -t europe-west2-docker.pkg.dev/$PROJECT_ID/tab-settle-repo/tab-settle-web:latest .
    secretEnv: [ 'GEMINI_KEY' ]

  # Step 2: Push Image
  - name: 'gcr.io/cloud-builders/docker'
    args: [ 'push', 'europe-west2-docker.pkg.dev/$PROJECT_ID/tab-settle-repo/tab-settle-web:latest' ]

  # Step 3: Deploy to Cloud Run (Enforcing Free Tier Constraints)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tab-settle-web'
      - '--image=europe-west2-docker.pkg.dev/$PROJECT_ID/tab-settle-repo/tab-settle-web:latest'
      - '--region=europe-west2'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=256Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/GEMINI_API_KEY/versions/latest
      env: 'GEMINI_KEY'

images:
  - 'europe-west2-docker.pkg.dev/$PROJECT_ID/tab-settle-repo/tab-settle-web:latest'